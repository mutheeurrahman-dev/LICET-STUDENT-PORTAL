<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LICET - Hall Ticket</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Arial,Verdana,sans-serif;font-size:12px;background:#eaf4fb;min-height:100vh;display:flex;flex-direction:column;}
    .header{background:#143D55;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
    .header-left{display:flex;align-items:center;gap:12px;}
    .header img.logo{height:50px;border-radius:50%;}
    .header-text h1{color:white;font-size:14px;font-weight:bold;}
    .header-text p{color:#a8d8f0;font-size:10px;}
    .header-right{text-align:right;}
    .student-name{font-size:13px;font-weight:bold;color:white;}
    .student-info{font-size:10px;color:#a8d8f0;margin-top:2px;}
    .btn-logout{margin-top:6px;background:#dc3545;color:white;border:none;padding:4px 12px;border-radius:3px;cursor:pointer;font-size:11px;}
    #dolphinnav{background:#1E73BE;height:33px;display:flex;align-items:center;}
    #dolphinnav a{color:white;text-decoration:none;padding:0 12px;height:33px;line-height:33px;font-size:11px;text-transform:uppercase;display:inline-block;}
    #dolphinnav a:hover{background:#fcfcfc;color:#1E73BE;font-weight:bold;}
    .page-wrapper{max-width:1000px;margin:20px auto;padding:0 16px;flex:1;width:100%;}
    .page-title{background:white;border-left:5px solid #1E73BE;padding:10px 16px;margin-bottom:16px;font-size:16px;font-weight:bold;color:#143D55;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
    a.back-btn{display:inline-block;background:#EBF3FC;color:#030a66;border:1px solid #A8BCD7;padding:6px 16px;border-radius:3px;text-decoration:none;font-size:12px;font-weight:bold;margin-bottom:16px;}
    a.back-btn:hover{background:#1E73BE;color:white;}
    .btn-print{background:#28a745;color:white;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:bold;margin-bottom:16px;margin-left:10px;}
    .hall-ticket{background:white;border:2px solid #143D55;border-radius:8px;padding:0;max-width:750px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,0.15);overflow:hidden;}
    .ht-header{background:#143D55;color:white;padding:16px 20px;text-align:center;}
    .ht-header img{height:60px;border-radius:50%;border:2px solid rgba(255,255,255,0.5);margin-bottom:8px;}
    .ht-header h2{font-size:16px;font-weight:bold;}
    .ht-header p{font-size:11px;opacity:0.8;margin-top:2px;}
    .ht-header .exam-title{background:rgba(255,255,255,0.15);margin-top:10px;padding:6px;border-radius:4px;font-size:13px;font-weight:bold;}
    .ht-body{padding:20px;}
    .ht-student-row{display:flex;gap:20px;margin-bottom:16px;align-items:flex-start;}
    .ht-photo{width:100px;height:120px;border:2px solid #D8D8D8;display:flex;align-items:center;justify-content:center;background:#f9f9f9;border-radius:4px;overflow:hidden;flex-shrink:0;}
    .ht-photo img{width:100%;height:100%;object-fit:cover;}
    .ht-details{flex:1;}
    .ht-details table{width:100%;border-collapse:collapse;}
    .ht-details td{padding:5px 8px;font-size:12px;border-bottom:1px solid #f0f0f0;}
    .ht-details td:first-child{font-weight:bold;color:#808080;width:140px;}
    .ht-details td:last-child{color:#143D55;font-weight:bold;}
    .ht-subjects table{width:100%;border-collapse:collapse;margin-top:10px;}
    .ht-subjects th{background:#1E73BE;color:white;padding:7px 10px;font-size:11px;font-weight:normal;text-align:left;}
    .ht-subjects td{border:1px solid #D8D8D8;padding:6px 10px;font-size:11px;}
    .ht-footer{background:#f6f7f8;border-top:2px solid #D8D8D8;padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-end;}
    .ht-footer .sig-box{text-align:center;width:160px;}
    .ht-footer .sig-line{border-top:1px solid #333;margin-top:30px;padding-top:4px;font-size:10px;color:#666;}
    .empty-state{text-align:center;color:#888;padding:40px;font-size:14px;background:white;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.1);}
    .footer{background:#f6f7f8;border-top:1px solid #D8D8D8;text-align:center;padding:10px;font-size:11px;color:#888;margin-top:20px;}
    @media print{
      .header,.dolphinnav,#dolphinnav,.back-btn,.btn-print,.page-title,.footer{display:none!important;}
      body{background:white;}
      .page-wrapper{margin:0;padding:0;}
      .hall-ticket{box-shadow:none;border:2px solid #143D55;}
    }
  </style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <img class="logo" src="./college.jpg" alt="LICET">
    <div class="header-text">
      <h1>Loyola-ICAM College of Engineering and Technology</h1>
      <p>Student Portal — LICET Chennai</p>
    </div>
  </div>
  <div class="header-right">
    <div class="student-name" id="sname">Loading...</div>
    <div class="student-info" id="sinfo"></div>
    <button class="btn-logout" onclick="doLogout()">🔴 Logout</button>
  </div>
</div>
<div id="dolphinnav">
  <a href="/home">🏠 Home</a>
  <a href="/cgpa-calculator">📊 CGPA Calculator</a>
  <a href="/profile">👤 Profile</a>
  <a href="#" onclick="doLogout()">🔴 Logout</a>
</div>
<div class="page-wrapper">
  <a class="back-btn" href="/home">← Back to Home</a>
  <button class="btn-print" onclick="window.print()">🖨️ Print Hall Ticket</button>
  <div class="page-title">🎫 Hall Ticket</div>
  <div id="ht-container"><div class="empty-state">Loading hall ticket...</div></div>
</div>
<div class="footer">Copyright &copy; 2026 LICET Student Portal. All rights reserved.</div>
<script>
  window.onload = async () => {
    const r = await fetch('/api/auth/me');
    const d = await r.json();
    if (!d.success) { window.location.href = '/login'; return; }
    const s = d.student;
    document.getElementById('sname').textContent = s.name;
    document.getElementById('sinfo').textContent = s.department + ' | ' + s.batch + ' | Sem ' + s.semester;

    // Fetch real hall ticket from DB
    const hr = await fetch('/api/student/hall-ticket');
    const hd = await hr.json();

    if (!hd.success || !hd.hall_ticket) {
      document.getElementById('ht-container').innerHTML =
        '<div class="empty-state">📭 No hall ticket has been issued yet. Please contact the examination office.</div>';
      return;
    }

    const ht = hd.hall_ticket;
    const subjectRows = (ht.subjects||[]).map((sub, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${sub.subject_code||''}</td>
        <td>${sub.subject_name||''}</td>
        <td>${sub.exam_date||'TBA'}</td>
        <td>${sub.exam_time||'10:00 AM'}</td>
        <td>${sub.session||'FN'}</td>
      </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:#888;">No subjects listed</td></tr>';

    document.getElementById('ht-container').innerHTML = `
      <div class="hall-ticket">
        <div class="ht-header">
          <img src="./college.jpg" alt="LICET Logo">
          <h2>LOYOLA-ICAM COLLEGE OF ENGINEERING AND TECHNOLOGY</h2>
          <p>Affiliated to Anna University, Chennai | NAAC Accredited</p>
          <div class="exam-title">HALL TICKET — ${ht.exam_month||'EXAMINATIONS'}</div>
        </div>
        <div class="ht-body">
          <div class="ht-student-row">
            <div class="ht-photo"><img src="./nophotomale.jpg" alt="Photo"></div>
            <div class="ht-details">
              <table>
                <tr><td>Register Number</td><td>${s.register_no}</td></tr>
                <tr><td>Student Name</td><td>${s.name}</td></tr>
                <tr><td>Department</td><td>${s.department}</td></tr>
                <tr><td>Semester</td><td>Semester ${s.semester}</td></tr>
                <tr><td>Batch</td><td>${s.batch}</td></tr>
                <tr><td>Exam Centre</td><td>${ht.exam_centre||'LICET Main Campus, Chennai - 600034'}</td></tr>
              </table>
            </div>
          </div>
          <div class="ht-subjects">
            <table>
              <thead><tr><th>#</th><th>Subject Code</th><th>Subject Name</th><th>Date</th><th>Time</th><th>Session</th></tr></thead>
              <tbody>${subjectRows}</tbody>
            </table>
          </div>
        </div>
        <div class="ht-footer">
          <div class="sig-box"><div class="sig-line">Student Signature</div></div>
          <div style="font-size:10px;color:#666;text-align:center;">
            ⚠️ This hall ticket must be produced at the examination hall.<br>
            Mobile phones are strictly prohibited in the exam hall.
          </div>
          <div class="sig-box"><div class="sig-line">Controller of Examinations</div></div>
        </div>
      </div>`;
  };
  function doLogout() {
    if (confirm('Logout?')) { fetch('/api/auth/logout').then(() => window.location.href = '/login'); }
  }
</script>
</body>
</html>
