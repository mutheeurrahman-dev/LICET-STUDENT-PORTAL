<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LICET - Notice Board</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Arial,Verdana,sans-serif;font-size:12px;background:#eaf4fb;min-height:100vh;display:flex;flex-direction:column;}
    .header{background:#143D55;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
    .header-left{display:flex;align-items:center;gap:12px;}
    .header img.logo{height:50px;border-radius:50%;}
    .header-text h1{color:white;font-size:14px;font-weight:bold;}
    .header-text p{color:#a8d8f0;font-size:10px;margin-top:2px;}
    .header-right{text-align:right;}
    .student-name{font-size:13px;font-weight:bold;color:white;}
    .student-info{font-size:10px;color:#a8d8f0;margin-top:2px;}
    .btn-logout{margin-top:6px;background:#dc3545;color:white;border:none;padding:4px 12px;border-radius:3px;cursor:pointer;font-size:11px;font-weight:bold;}
    #dolphinnav{background:#1E73BE;height:33px;display:flex;align-items:center;}
    #dolphinnav a{color:white;text-decoration:none;padding:0 12px;height:33px;line-height:33px;font-size:11px;text-transform:uppercase;display:inline-block;}
    #dolphinnav a:hover,#dolphinnav a.active{background:#fcfcfc;color:#1E73BE;font-weight:bold;}
    .page-wrapper{max-width:1000px;margin:20px auto;padding:0 16px;flex:1;width:100%;}
    .page-title{background:white;border-left:5px solid #1E73BE;padding:10px 16px;margin-bottom:16px;font-size:16px;font-weight:bold;color:#143D55;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
    .panel{background:white;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.1);margin-bottom:20px;overflow:hidden;}
    .panel-header{background:#F6F7F8;border-bottom:1px solid #D8D8D8;padding:10px 16px;font-weight:bold;color:#143D55;font-size:13px;}
    .panel-body{padding:16px;}
    .notice-item{border-bottom:1px solid #f0f0f0;padding:14px 0;display:flex;gap:16px;align-items:flex-start;}
    .notice-item:last-child{border-bottom:none;}
    .notice-date{min-width:80px;text-align:center;background:#1E73BE;color:white;border-radius:6px;padding:8px 6px;font-size:11px;font-weight:bold;}
    .notice-date .day{font-size:22px;font-weight:bold;line-height:1;}
    .notice-content h3{font-size:13px;color:#143D55;font-weight:bold;margin-bottom:4px;}
    .notice-content p{font-size:11px;color:#666;line-height:1.5;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold;margin-left:8px;}
    .badge-red{background:#f8d7da;color:#721c24;}
    .badge-green{background:#d4edda;color:#155724;}
    .badge-blue{background:#cce5ff;color:#004085;}
    .footer{background:#f6f7f8;border-top:1px solid #D8D8D8;text-align:center;padding:10px;font-size:11px;color:#888;margin-top:auto;}
    a.back-btn{display:inline-block;background:#EBF3FC;color:#030a66;border:1px solid #A8BCD7;padding:6px 16px;border-radius:3px;text-decoration:none;font-size:12px;font-weight:bold;margin-bottom:16px;}
    a.back-btn:hover{background:#1E73BE;color:white;}
  </style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <img class="logo" src="./college.jpg" alt="LICET">
    <div class="header-text">
      <h1>Loyola-ICAM College of Engineering and Technology</h1>
      <p>Student Portal — LICET Chennai</p>
    </div>
  </div>
  <div class="header-right">
    <div class="student-name" id="sname">Loading...</div>
    <div class="student-info" id="sinfo"></div>
    <button class="btn-logout" onclick="doLogout()">🔴 Logout</button>
  </div>
</div>
<div id="dolphinnav">
  <a href="/home">🏠 Home</a>
  <a href="/cgpa-calculator">📊 CGPA Calculator</a>
  <a href="/profile">👤 Profile</a>
  <a href="#" onclick="doLogout()">🔴 Logout</a>
</div>
<div class="page-wrapper">
  <a class="back-btn" href="/home">← Back to Home</a>
  <div class="page-title">📋 Notice Board</div>
  <div class="panel">
    <div class="panel-header">📢 Latest Announcements</div>
    <div class="panel-body" id="notices-body">
      <div style="text-align:center;padding:30px;color:#888;">⏳ Loading notices...</div>
    </div>
  </div>
</div>
<div class="footer">Copyright &copy; 2026 LICET Student Portal. All rights reserved.</div>
<script>
  const STATIC_NOTICES = [
    { title: 'End Semester Examination Schedule — April 2026', content: 'The End Semester Examinations for all UG & PG programmes will commence from 20th April 2026. Students are advised to download their hall tickets from the portal before 10th April 2026.', category: 'Important', created_at: '2026-02-25' },
    { title: 'Exam Application — Last Date Extended', content: 'The last date for submitting exam applications has been extended to 28th February 2026. Students who have not yet applied are requested to do so immediately through the Exam Application section.', category: 'Update', created_at: '2026-02-20' },
    { title: 'Internal Assessment Marks — Published', content: 'Internal Assessment marks for Semester 4 (Nov/Dec 2025) have been published. Students can view their marks by logging into the portal. Any discrepancies must be reported to the exam cell within 5 days.', category: 'Published', created_at: '2026-02-15' },
    { title: 'Revaluation Results — Semester 3', content: 'Revaluation results for Semester 3 examinations have been published. Students can check their updated results in the Revaluation Result section of the portal.', category: 'Published', created_at: '2026-02-10' },
    { title: 'Anti-Ragging Committee Meeting', content: 'The Anti-Ragging Committee will conduct its quarterly meeting on 12th February 2026. All students are reminded that ragging in any form is strictly prohibited and punishable under law.', category: 'Notice', created_at: '2026-02-05' },
    { title: 'Scholarship Application — 2025-2026', content: 'Students eligible for Government scholarships (BC, MBC, SC/ST) must submit their applications along with required documents to the scholarship section before 28th February 2026.', category: 'Deadline', created_at: '2026-02-01' }
  ];

  function catBadge(cat) {
    const map = { 'Important':'badge-red','Deadline':'badge-red','Update':'badge-blue','Notice':'badge-blue','Published':'badge-green','General':'badge-blue' };
    return map[cat] || 'badge-blue';
  }

  function renderNotices(notices) {
    const body = document.getElementById('notices-body');
    if (!notices || notices.length === 0) {
      body.innerHTML = '<div style="text-align:center;padding:30px;color:#888;">📭 No notices posted yet.</div>';
      return;
    }
    body.innerHTML = notices.map(n => {
      const d = new Date(n.created_at);
      const day = isNaN(d) ? '—' : d.getDate();
      const mon = isNaN(d) ? '' : d.toLocaleString('en-IN',{month:'short',year:'numeric'});
      return `<div class="notice-item">
        <div class="notice-date"><div class="day">${day}</div>${mon}</div>
        <div class="notice-content">
          <h3>${n.title} <span class="badge ${catBadge(n.category)}">${n.category||'Notice'}</span></h3>
          <p>${n.content}</p>
        </div>
      </div>`;
    }).join('');
  }

  window.onload = async () => {
    try {
      const r = await fetch('/api/auth/me');
      const d = await r.json();
      if (!d.success) { window.location.href = '/login'; return; }
      document.getElementById('sname').textContent = d.student.name;
      document.getElementById('sinfo').textContent = d.student.department + ' | ' + d.student.batch + ' | Sem ' + d.student.semester;

      // Fetch notices from DB (faculty route is readable by all logged-in users)
      try {
        const nr = await fetch('/api/student/notices');
        const nd = await nr.json();
        if (nd.success && nd.notices && nd.notices.length > 0) {
          renderNotices(nd.notices);
        } else {
          // Fall back to static notices if DB has none
          renderNotices(STATIC_NOTICES);
        }
      } catch(e) {
        renderNotices(STATIC_NOTICES);
      }
    } catch(e) {
      window.location.href = '/login';
    }
  };

  function doLogout() {
    if (confirm('Logout?')) { fetch('/api/auth/logout').then(() => window.location.href = '/login'); }
  }
</script>
</body>
</html>
